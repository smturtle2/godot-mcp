[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "godot-mcp"
dynamic = ["version"]
description = "Build, play, and understand Godot projects through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
authors = [{name = "Godot MCP contributors"}]
dependencies = [
    "mcp==2.2.0",
    "websockets>=15,<17",
    "jsonschema>=4.23,<5",
    "tomlkit>=0.13,<1",
    "psutil>=7,<9",
]

[project.urls]
Repository = "https://github.com/smturtle2/godot-mcp"
Issues = "https://github.com/smturtle2/godot-mcp/issues"

[project.scripts]
godot-mcp = "godot_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "build>=1.2,<2"]

[tool.hatch.version]
path = "src/godot_mcp/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: launches a real Godot editor", "rendered: requires a display and renderer"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
